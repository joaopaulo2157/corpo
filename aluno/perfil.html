<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - CorpoFitness</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --dark-card: #1e1e1e;
            --accent: #1e88e5;
            --accent-hover: #1565c0;
            --highlight: #ffffff;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border: #2a2a2a;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-voltar {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voltar:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-card {
            background-color: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            background: rgba(30, 136, 229, 0.15);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--accent);
        }

        .profile-info h3 {
            color: var(--highlight);
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .form-group input, .form-group select {
            background-color: #161616;
            border: 1px solid var(--border);
            color: var(--highlight);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent);
        }

        .btn-save {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save:hover {
            background-color: var(--accent-hover);
        }
    </style>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon-corpofitness-v6.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32-corpofitness-v6.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16-corpofitness-v6.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="manifest" href="/aluno/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corpofitness">
</head>
<body>
<div class="cf-official-brand" style="display:flex;justify-content:center;align-items:center;padding:12px 16px 8px;position:relative;z-index:20;">
  <a href="/aluno/portal-seguro.html" aria-label="Corpofitness" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">
    <img src="/img/logo.png" alt="Academia Corpofitness" style="display:block;max-width:min(240px,72vw);max-height:70px;width:auto;height:auto;object-fit:contain;">
  </a>
</div>

    <header>
        <a href="/aluno/portal-seguro.html" class="logo-area">
            <i class="fa-solid fa-dumbbell"></i> CORPOFITNESS
        </a>
        <a href="/aluno/portal-seguro.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
        </a>
    </header>

    <main>
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="profile-info">
                    <h3 id="lblNomePerfil">Carregando...</h3>
                    <p id="lblEmailPerfil">Carregando e-mail...</p>
                </div>
            </div>

            <form id="formPerfil" onsubmit="atualizarPerfil(event)" style="display: flex; flex-direction: column; gap: 20px;">
                <div class="form-group">
                    <label for="txtNome">Nome Completo</label>
                    <input type="text" id="txtNome" required>
                </div>

                <div class="form-group">
                    <label for="txtTelefone">Telefone / WhatsApp</label>
                    <input type="text" id="txtTelefone" placeholder="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="selectObjetivo">Objetivo Principal</label>
                    <select id="selectObjetivo">
                        <option value="Hipertrofia">Hipertrofia</option>
                        <option value="Emagrecimento">Emagrecimento</option>
                        <option value="Condicionamento Físico">Condicionamento Físico</option>
                        <option value="Saúde e Bem-estar">Saúde e Bem-estar</option>
                    </select>
                </div>

                <button type="submit" class="btn-save" id="btnSalvar">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
                </button>
            </form>
        </div>
    </main>

    <script>
(() => {
    'use strict';

    const SUPABASE_URL = 'https://rylbznbtrrsuyzxgsivg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3xR7VpxN0s-nIgn6t2COGA_3n9dnoBC';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
            flowType: 'pkce',
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storageKey: 'corpofitness.aluno.auth'
        }
    });

    let usuarioAtual = null;

    async function obterMatriculaDoAluno() {
        const { data: { session }, error: sessionError } = await _supabase.auth.getSession();
        if (sessionError) throw sessionError;

        const user = session?.user;
        if (!user?.id || !user?.email) return null;

        let { data: aluno, error } = await _supabase
            .from('alunos')
            .select('id,nome,email,tel,plano,status,auth_user_id')
            .eq('auth_user_id', user.id)
            .maybeSingle();

        if (error) throw error;

        if (!aluno) {
            const fallback = await _supabase
                .from('alunos')
                .select('id,nome,email,tel,plano,status,auth_user_id')
                .eq('email', user.email)
                .maybeSingle();

            if (fallback.error) throw fallback.error;
            aluno = fallback.data;
        }

        if (!aluno) return null;

        const perfil = await _supabase
            .from('perfis')
            .select('id,nome,email,telefone,plano')
            .eq('id', user.id)
            .maybeSingle();

        const p = perfil.error ? null : perfil.data;
        const objetivo = localStorage.getItem(`corpofitness_objetivo_${aluno.id}`) || '';

        return {
            id: aluno.id,
            auth_user_id: user.id,
            nome: p?.nome || aluno.nome || user.user_metadata?.full_name || 'Aluno(a)',
            email: aluno.email || user.email,
            telefone: p?.telefone || aluno.tel || '',
            plano: aluno.plano || p?.plano || '',
            status: aluno.status || '',
            objetivo
        };
    }

    async function carregarPerfil() {
        try {
            usuarioAtual = await obterMatriculaDoAluno();

            if (!usuarioAtual) {
                window.location.replace('/aluno/portal-seguro.html');
                return;
            }

            sessionStorage.setItem('corpofitness_aluno_id', usuarioAtual.id);
            sessionStorage.setItem('corpofitness_aluno_logado', JSON.stringify({
                id: usuarioAtual.id,
                nome: usuarioAtual.nome,
                email: usuarioAtual.email,
                plano: usuarioAtual.plano,
                status: usuarioAtual.status
            }));

            document.getElementById('lblNomePerfil').textContent = usuarioAtual.nome || 'Aluno(a)';
            document.getElementById('lblEmailPerfil').textContent = usuarioAtual.email || '';
            document.getElementById('txtNome').value = usuarioAtual.nome || '';
            document.getElementById('txtTelefone').value = usuarioAtual.telefone || '';

            if (usuarioAtual.objetivo) {
                document.getElementById('selectObjetivo').value = usuarioAtual.objetivo;
            }
        } catch (err) {
            console.error('[Perfil] Falha ao carregar:', err);
            alert('Não foi possível carregar seu perfil agora.');
        }
    }

    window.atualizarPerfil = async function(event) {
        event.preventDefault();

        if (!usuarioAtual?.auth_user_id) {
            alert('Sua sessão expirou. Entre novamente.');
            window.location.replace('/aluno/portal-seguro.html');
            return;
        }

        const btn = document.getElementById('btnSalvar');
        const novoNome = document.getElementById('txtNome').value.trim();
        const novoTelefone = document.getElementById('txtTelefone').value.trim();
        const novoObjetivo = document.getElementById('selectObjetivo').value;

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';

        try {
            const payload = {
                id: usuarioAtual.auth_user_id,
                nome: novoNome || usuarioAtual.nome || 'Aluno(a)',
                email: usuarioAtual.email,
                telefone: novoTelefone || null,
                tipo: 'aluno',
                plano: usuarioAtual.plano || null
            };

            const { error } = await _supabase
                .from('perfis')
                .upsert(payload, { onConflict: 'id' });

            if (error) throw error;

            localStorage.setItem(`corpofitness_objetivo_${usuarioAtual.id}`, novoObjetivo);

            usuarioAtual.nome = payload.nome;
            usuarioAtual.telefone = novoTelefone;
            usuarioAtual.objetivo = novoObjetivo;

            sessionStorage.setItem('corpofitness_aluno_logado', JSON.stringify({
                id: usuarioAtual.id,
                nome: usuarioAtual.nome,
                email: usuarioAtual.email,
                plano: usuarioAtual.plano,
                status: usuarioAtual.status
            }));

            document.getElementById('lblNomePerfil').textContent = usuarioAtual.nome;
            alert('Perfil atualizado com sucesso!');
        } catch (err) {
            console.error('[Perfil] Erro ao atualizar:', err);
            alert('Erro ao salvar as alterações.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar Alterações';
        }
    };

    window.addEventListener('DOMContentLoaded', carregarPerfil, { once: true });
})();
</script>
</body>
</html>
