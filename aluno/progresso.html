<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Progresso - CorpoFitness</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --dark-card: #1e1e1e;
            --accent: #1e88e5;
            --accent-hover: #1565c0;
            --highlight: #ffffff;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border: #2a2a2a;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--highlight);
        }

        .logo-area i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .logo-area h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .btn-voltar {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--highlight);
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-voltar:hover {
            border-color: var(--accent);
            background: rgba(30, 136, 229, 0.1);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .page-title {
            font-size: 1.5rem;
            color: var(--highlight);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: var(--accent);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 i {
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background-color: #121212;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--highlight);
            font-size: 0.95rem;
        }

        .form-group input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: var(--highlight);
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .table-container {
            max-height: 450px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background-color: #181818;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        td {
            color: var(--text-main);
        }
    </style>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon-corpofitness-v6.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32-corpofitness-v6.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16-corpofitness-v6.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="manifest" href="/aluno/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corpofitness">
</head>
<body>
<div class="cf-official-brand" style="display:flex;justify-content:center;align-items:center;padding:12px 16px 8px;position:relative;z-index:20;">
  <a href="/aluno/portal-seguro.html" aria-label="Corpofitness" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">
    <img src="/img/logo.png" alt="Academia Corpofitness" style="display:block;max-width:min(240px,72vw);max-height:70px;width:auto;height:auto;object-fit:contain;">
  </a>
</div>

    <header>
        <a href="/aluno/portal-seguro.html" class="logo-area">
            <i class="fa-solid fa-dumbbell"></i>
            <h1>CORPOFITNESS</h1>
        </a>
        <div>
            <a href="/aluno/portal-seguro.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Painel</a>
        </div>
    </header>

    <main>
        <h2 class="page-title"><i class="fa-solid fa-chart-line"></i> Acompanhamento de Progresso</h2>

        <div class="grid-layout">
            <!-- Formulário de Novo Registro -->
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle"></i> Registrar Medidas</h3>
                <form id="formProgresso">
                    <div class="form-group">
                        <label for="dataRegistro">Data da Medição</label>
                        <input type="date" id="dataRegistro" required>
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso Atual (kg)</label>
                        <input type="number" step="0.1" id="peso" placeholder="Ex: 75.5" required>
                    </div>
                    <div class="form-group">
                        <label for="cintura">Cintura (cm)</label>
                        <input type="number" step="0.1" id="cintura" placeholder="Ex: 82">
                    </div>
                    <div class="form-group">
                        <label for="braco">Braço (cm)</label>
                        <input type="number" step="0.1" id="braco" placeholder="Ex: 35">
                    </div>
                    <div class="form-group">
                        <label for="coxa">Coxa (cm)</label>
                        <input type="number" step="0.1" id="coxa" placeholder="Ex: 55">
                    </div>
                    <button type="submit" id="btnSalvarProgresso" class="btn-submit">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar Registro
                    </button>
                </form>
            </div>

            <!-- Histórico de Evolução -->
            <div class="card">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Histórico de Evolução</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Peso</th>
                                <th>Cintura</th>
                                <th>Braço</th>
                                <th>Coxa</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProgresso">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando histórico...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
(() => {
    'use strict';

    const SUPABASE_URL = 'https://rylbznbtrrsuyzxgsivg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3xR7VpxN0s-nIgn6t2COGA_3n9dnoBC';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
            flowType: 'pkce',
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storageKey: 'corpofitness.aluno.auth'
        }
    });

    let usuarioAtual = null;

    async function obterMatriculaDoAluno() {
        const { data: { session }, error: sessionError } = await _supabase.auth.getSession();
        if (sessionError) throw sessionError;

        const user = session?.user;
        if (!user?.id || !user?.email) return null;

        let { data: aluno, error } = await _supabase
            .from('alunos')
            .select('id,nome,email,tel,plano,status,auth_user_id')
            .eq('auth_user_id', user.id)
            .maybeSingle();

        if (error) throw error;

        if (!aluno) {
            const fallback = await _supabase
                .from('alunos')
                .select('id,nome,email,tel,plano,status,auth_user_id')
                .eq('email', user.email)
                .maybeSingle();

            if (fallback.error) throw fallback.error;
            aluno = fallback.data;
        }

        if (!aluno) return null;

        return {
            id: aluno.id,
            auth_user_id: user.id,
            nome: aluno.nome || 'Aluno(a)',
            email: aluno.email || user.email,
            plano: aluno.plano || '',
            status: aluno.status || ''
        };
    }

    async function iniciarPagina() {
        document.getElementById('dataRegistro').valueAsDate = new Date();

        try {
            usuarioAtual = await obterMatriculaDoAluno();

            if (!usuarioAtual) {
                window.location.replace('/aluno/portal-seguro.html');
                return;
            }

            sessionStorage.setItem('corpofitness_aluno_id', usuarioAtual.id);
            sessionStorage.setItem('corpofitness_aluno_logado', JSON.stringify(usuarioAtual));

            await carregarHistoricoProgresso(usuarioAtual.id, usuarioAtual.email);
        } catch (err) {
            console.error('[Progresso] Falha ao iniciar:', err);
            document.getElementById('tabelaProgresso').innerHTML =
                '<tr><td colspan="5" style="text-align:center;color:#ff5252;">Não foi possível carregar seu progresso.</td></tr>';
        }
    }

    document.getElementById('formProgresso').addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!usuarioAtual?.id) {
            window.location.replace('/aluno/portal-seguro.html');
            return;
        }

        const btn = document.getElementById('btnSalvarProgresso');
        const dataRegistro = document.getElementById('dataRegistro').value;
        const peso = parseFloat(document.getElementById('peso').value);
        const cintura = document.getElementById('cintura').value ? parseFloat(document.getElementById('cintura').value) : null;
        const braco = document.getElementById('braco').value ? parseFloat(document.getElementById('braco').value) : null;
        const coxa = document.getElementById('coxa').value ? parseFloat(document.getElementById('coxa').value) : null;

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';

        try {
            const { error } = await _supabase
                .from('progresso_alunos')
                .insert({
                    aluno_id: usuarioAtual.id,
                    email_aluno: usuarioAtual.email,
                    data_registro: dataRegistro,
                    peso,
                    cintura,
                    braco,
                    coxa
                });

            if (error) throw error;

            alert('Medidas registradas com sucesso!');
            document.getElementById('formProgresso').reset();
            document.getElementById('dataRegistro').valueAsDate = new Date();

            await carregarHistoricoProgresso(usuarioAtual.id, usuarioAtual.email);
        } catch (err) {
            console.error('[Progresso] Erro ao salvar:', err);
            alert('Erro ao salvar os dados. Tente novamente.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar Registro';
        }
    });

    async function carregarHistoricoProgresso(alunoId, alunoEmail) {
        const tbody = document.getElementById('tabelaProgresso');

        try {
            let query = _supabase
                .from('progresso_alunos')
                .select('*')
                .eq('aluno_id', alunoId)
                .order('data_registro', { ascending: false });

            const { data: registros, error } = await query;

            if (error) throw error;

            if (!registros || registros.length === 0) {
                tbody.innerHTML =
                    '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Nenhum registro de progresso encontrado.</td></tr>';
                return;
            }

            tbody.innerHTML = registros.map(reg => {
                const dataFmt = reg.data_registro
                    ? reg.data_registro.split('-').reverse().join('/')
                    : '-';

                return `
                    <tr>
                        <td>${dataFmt}</td>
                        <td><strong>${reg.peso != null ? reg.peso + ' kg' : '-'}</strong></td>
                        <td>${reg.cintura != null ? reg.cintura + ' cm' : '-'}</td>
                        <td>${reg.braco != null ? reg.braco + ' cm' : '-'}</td>
                        <td>${reg.coxa != null ? reg.coxa + ' cm' : '-'}</td>
                    </tr>
                `;
            }).join('');
        } catch (err) {
            console.error('[Progresso] Erro ao carregar histórico:', err);
            tbody.innerHTML =
                '<tr><td colspan="5" style="text-align:center;color:#ff5252;">Erro ao carregar dados do banco.</td></tr>';
        }
    }

    window.addEventListener('DOMContentLoaded', iniciarPagina, { once: true });
})();
</script>
</body>
</html>
