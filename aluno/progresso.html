<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Progresso - CorpoFitness</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --dark-card: #1e1e1e;
            --accent: #1e88e5;
            --accent-hover: #1565c0;
            --highlight: #ffffff;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border: #2a2a2a;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--highlight);
        }

        .logo-area i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .logo-area h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .btn-voltar {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--highlight);
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-voltar:hover {
            border-color: var(--accent);
            background: rgba(30, 136, 229, 0.1);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .page-title {
            font-size: 1.5rem;
            color: var(--highlight);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i {
            color: var(--accent);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 i {
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background-color: #121212;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--highlight);
            font-size: 0.95rem;
        }

        .form-group input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: var(--highlight);
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .table-container {
            max-height: 450px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background-color: #181818;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        td {
            color: var(--text-main);
        }
    </style>
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Corpofitness">
</head>
<body>

    <header>
        <a href="index.html" class="logo-area">
            <i class="fa-solid fa-dumbbell"></i>
            <h1>CORPOFITNESS</h1>
        </a>
        <div>
            <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Painel</a>
        </div>
    </header>

    <main>
        <h2 class="page-title"><i class="fa-solid fa-chart-line"></i> Acompanhamento de Progresso</h2>

        <div class="grid-layout">
            <!-- Formulário de Novo Registro -->
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle"></i> Registrar Medidas</h3>
                <form id="formProgresso">
                    <div class="form-group">
                        <label for="dataRegistro">Data da Medição</label>
                        <input type="date" id="dataRegistro" required>
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso Atual (kg)</label>
                        <input type="number" step="0.1" id="peso" placeholder="Ex: 75.5" required>
                    </div>
                    <div class="form-group">
                        <label for="cintura">Cintura (cm)</label>
                        <input type="number" step="0.1" id="cintura" placeholder="Ex: 82">
                    </div>
                    <div class="form-group">
                        <label for="braco">Braço (cm)</label>
                        <input type="number" step="0.1" id="braco" placeholder="Ex: 35">
                    </div>
                    <div class="form-group">
                        <label for="coxa">Coxa (cm)</label>
                        <input type="number" step="0.1" id="coxa" placeholder="Ex: 55">
                    </div>
                    <button type="submit" id="btnSalvarProgresso" class="btn-submit">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar Registro
                    </button>
                </form>
            </div>

            <!-- Histórico de Evolução -->
            <div class="card">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Histórico de Evolução</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Peso</th>
                                <th>Cintura</th>
                                <th>Braço</th>
                                <th>Coxa</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProgresso">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando histórico...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://rylbznbtrrsuyzxgsivg.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_3xR7VpxN0s-nIgn6t2COGA_3n9dnoBC';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioAtual = null;

        window.addEventListener('DOMContentLoaded', async () => {
            // Define a data atual por padrão no input
            document.getElementById('dataRegistro').valueAsDate = new Date();

            usuarioAtual = JSON.parse(sessionStorage.getItem('corpofitness_usuario')) ||
                           JSON.parse(sessionStorage.getItem('corpofitness_cliente_logado'));

            if (!usuarioAtual) {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session && session.user) {
                    usuarioAtual = { id: session.user.id, email: session.user.email };
                }
            }

            if (!usuarioAtual) {
                window.location.href = 'login-cliente.html';
                return;
            }

            await carregarHistoricoProgresso(usuarioAtual.id, usuarioAtual.email);
        });

        document.getElementById('formProgresso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvarProgresso');
            
            const dataRegistro = document.getElementById('dataRegistro').value;
            const peso = parseFloat(document.getElementById('peso').value);
            const cintura = document.getElementById('cintura').value ? parseFloat(document.getElementById('cintura').value) : null;
            const braco = document.getElementById('braco').value ? parseFloat(document.getElementById('braco').value) : null;
            const coxa = document.getElementById('coxa').value ? parseFloat(document.getElementById('coxa').value) : null;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Salvando...`;

            try {
                const { error } = await _supabase.from('progresso_alunos').insert([
                    {
                        aluno_id: usuarioAtual.id || null,
                        email_aluno: usuarioAtual.email || null,
                        data_registro: dataRegistro,
                        peso: peso,
                        cintura: cintura,
                        braco: braco,
                        coxa: coxa
                    }
                ]);

                if (error) throw error;

                alert('Medidas registradas com sucesso!');
                document.getElementById('formProgresso').reset();
                document.getElementById('dataRegistro').valueAsDate = new Date();
                await carregarHistoricoProgresso(usuarioAtual.id, usuarioAtual.email);

            } catch (err) {
                console.error("Erro ao salvar progresso:", err);
                alert('Erro ao salvar os dados. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Salvar Registro`;
            }
        });

        async function carregarHistoricoProgresso(alunoId, alunoEmail) {
            const tbody = document.getElementById('tabelaProgresso');

            try {
                let query = _supabase.from('progresso_alunos').select('*').order('data_registro', { ascending: false });

                if (alunoId) {
                    query = query.eq('aluno_id', alunoId);
                } else if (alunoEmail) {
                    query = query.eq('email_aluno', alunoEmail);
                }

                const { data: registros, error } = await query;

                if (error) throw error;

                if (!registros || registros.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Nenhum registro de progresso encontrado.</td></tr>`;
                    return;
                }

                let html = '';
                registros.forEach(reg => {
                    const dataFmt = reg.data_registro ? reg.data_registro.split('-').reverse().join('/') : '-';
                    html += `
                        <tr>
                            <td>${dataFmt}</td>
                            <td><strong>${reg.peso} kg</strong></td>
                            <td>${reg.cintura ? reg.cintura + ' cm' : '-'}</td>
                            <td>${reg.braco ? reg.braco + ' cm' : '-'}</td>
                            <td>${reg.coxa ? reg.coxa + ' cm' : '-'}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (err) {
                console.error("Erro ao carregar histórico:", err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff5252;">Erro ao carregar dados do banco.</td></tr>`;
            }
        }
    </script>
</body>
</html>
