<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#071023">
<title>Meu Treino | Corpofitness</title>
<link rel="icon" href="../favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="../js/supabase-config.js"></script>
<style>
:root{--blue:#2563eb;--blue2:#60a5fa;--bg:#071023;--surface:#101b35;--card:#15213e;--border:rgba(148,163,184,.17);--text:#f8fafc;--muted:#94a3b8;--success:#34d399;--warning:#fbbf24;--danger:#f87171}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(37,99,235,.2),transparent 30%),var(--bg);color:var(--text);font-family:Poppins,sans-serif}.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(14px,4vw,38px);background:rgba(7,16,35,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.brand{font-family:Anton,sans-serif;letter-spacing:.7px;font-size:1.35rem}.brand span{color:var(--blue2)}.head-actions{display:flex;gap:8px}.head-btn{border:1px solid var(--border);background:rgba(255,255,255,.03);color:#fff;padding:9px 11px;border-radius:10px;text-decoration:none;cursor:pointer}
main{width:min(1200px,100%);margin:auto;padding:26px clamp(14px,4vw,34px) 60px}.summary{border:1px solid rgba(96,165,250,.23);border-radius:20px;padding:22px;background:linear-gradient(135deg,rgba(37,99,235,.17),rgba(16,27,53,.82));display:grid;grid-template-columns:1fr auto;gap:18px;margin-bottom:18px}.summary h1{margin:0 0 5px;font-size:clamp(1.4rem,4vw,2rem)}.summary p{margin:0;color:var(--muted);font-size:.84rem}.cycle{text-align:right;font-size:.75rem;color:var(--muted)}.cycle strong{display:block;color:var(--warning);font-size:.95rem;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat{border:1px solid var(--border);background:rgba(16,27,53,.82);border-radius:15px;padding:14px}.stat small{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase}.stat strong{display:block;margin-top:6px;font-size:.95rem}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:15px}.tab{min-width:54px;border:1px solid var(--border);border-radius:999px;padding:9px 14px;background:#101b35;color:var(--muted);font-weight:800;cursor:pointer}.tab.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.list{display:grid;gap:11px}.exercise{border:1px solid var(--border);background:rgba(16,27,53,.82);border-radius:17px;padding:16px}.exercise-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.exercise h3{margin:0;font-size:.95rem}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:.62rem;font-weight:800;background:rgba(37,99,235,.15);color:var(--blue2);border:1px solid rgba(96,165,250,.2)}.badge-conj{background:rgba(251,191,36,.1);color:var(--warning);border-color:rgba(251,191,36,.25)}.prescription{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.pbox{padding:9px;border-radius:10px;background:#0a142a}.pbox small{display:block;color:var(--muted);font-size:.6rem;text-transform:uppercase}.pbox strong{display:block;font-size:.76rem;margin-top:3px}.notes{margin-top:9px;color:var(--muted);font-size:.73rem}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.small-btn{border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;border-radius:9px;padding:8px 10px;font-size:.7rem;cursor:pointer}.small-btn.primary{border-color:rgba(96,165,250,.35);color:var(--blue2)}.small-btn.success{border-color:rgba(52,211,153,.3);color:#6ee7b7}
.conj-list{margin-top:10px;border-top:1px dashed rgba(251,191,36,.25);padding-top:8px}.sub{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border)}.sub:last-child{border-bottom:0}.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(251,191,36,.12);color:var(--warning);font-size:.65rem;font-weight:900}.sub small{color:var(--muted)}
.empty{border:1px dashed var(--border);border-radius:17px;padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);display:none;place-items:center;padding:18px}.modal.open{display:grid}.modal-card{width:min(100%,680px);max-height:90vh;overflow:auto;background:#101b35;border:1px solid var(--border);border-radius:20px;padding:18px}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.modal-head h3{margin:0;font-size:1rem}.close{border:0;background:transparent;color:var(--muted);font-size:1.2rem;cursor:pointer}video{display:block;width:100%;max-height:70vh;background:#000;border-radius:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{display:block;color:var(--muted);font-size:.67rem;font-weight:700;text-transform:uppercase;margin-bottom:5px}.field{width:100%;border:1px solid var(--border);border-radius:10px;background:#0a142a;color:#fff;padding:10px}.save{width:100%;border:0;border-radius:11px;padding:12px;background:var(--blue);color:#fff;font-weight:800;margin-top:12px;cursor:pointer}
#guard{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);padding:20px}.guard-card{text-align:center;color:var(--muted)}.guard-card i{font-size:2rem;color:var(--blue2);margin-bottom:12px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.prescription{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr}.cycle{text-align:left}.form-grid{grid-template-columns:1fr}}@media(max-width:430px){.prescription{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.head-btn span{display:none}}
</style>
</head>
<body>
<div id="guard"><div class="guard-card"><i class="fa-solid fa-shield-halved fa-pulse"></i><div>Validando seu acesso...</div></div></div>
<header><div class="brand">CORPOFITNESS<span>.</span></div><div class="head-actions"><a class="head-btn" href="portal-seguro.html"><i class="fa-solid fa-house"></i> <span>Portal</span></a><button class="head-btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
<main>
<section class="summary"><div><h1 id="title">Seu Plano de Treino 🏋️</h1><p id="subtitle">Ficha personalizada pela equipe técnica.</p></div><div class="cycle">Próxima revisão<strong id="review">--</strong></div></section>
<section class="stats"><div class="stat"><small>Objetivo</small><strong id="objective">--</strong></div><div class="stat"><small>Nível</small><strong id="level">--</strong></div><div class="stat"><small>Divisão</small><strong id="division">--</strong></div><div class="stat"><small>Versão</small><strong id="version">--</strong></div></section>
<div id="tabs" class="tabs"></div><section id="list" class="list"><div class="empty">Carregando ficha...</div></section>
</main>
<div id="videoModal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="videoTitle">Execução</h3><button class="close" data-close="videoModal">✕</button></div><video id="video" controls controlsList="nodownload" playsinline></video></div></div>
<div id="execModal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="execTitle">Registrar execução</h3><button class="close" data-close="execModal">✕</button></div><form id="execForm"><input id="execLibId" type="hidden"><input id="execName" type="hidden"><input id="execBlock" type="hidden"><div class="form-grid"><div><label class="label">Carga realizada</label><input id="execLoad" class="field" placeholder="Ex.: 40 kg"></div><div><label class="label">Repetições realizadas</label><input id="execReps" class="field" placeholder="Ex.: 12/12/10"></div><div><label class="label">RPE</label><input id="execRpe" class="field" type="number" min="1" max="10" step=".5" placeholder="1–10"></div><div><label class="label">RIR</label><input id="execRir" class="field" type="number" min="0" max="10" step="1" placeholder="0–10"></div></div><div style="margin-top:10px"><label class="label">Observação</label><input id="execObs" class="field" placeholder="Como foi a execução?"></div><button class="save" type="submit">Salvar execução</button></form></div></div>
<script>
(()=>{'use strict';
let aluno=null,treino=null,ficha={A:[],B:[],C:[],D:[],E:[]},bloco='A',bibId={},bibNome={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=v=>String(v||'').trim().toLowerCase();
async function validar(){const {data:{user}}=await _supabase.auth.getUser();if(!user){location.replace('portal-seguro.html');return false}let q=await _supabase.from('alunos').select('id,nome,email,status,auth_user_id').eq('auth_user_id',user.id).maybeSingle();if(q.error)throw q.error;if(!q.data)q=await _supabase.from('alunos').select('id,nome,email,status,auth_user_id').eq('email',user.email).maybeSingle();if(!q.data||norm(q.data.status)!=='ativo'){await _supabase.auth.signOut();location.replace('portal-seguro.html');return false}aluno=q.data;sessionStorage.setItem('corpofitness_aluno_id',aluno.id);return true}
async function biblioteca(){const {data,error}=await _supabase.from('biblioteca_exercicios').select('id,nome,video_url');if(error)throw error;(data||[]).forEach(x=>{bibId[String(x.id)]=x;bibNome[norm(x.nome)]=x})}
function parseConteudo(c){if(!c)return{};try{return typeof c==='string'?JSON.parse(c):c}catch(_){return{}}}
async function carregar(){const {data,error}=await _supabase.from('treinos_alunos').select('*').eq('aluno_id',aluno.id).order('ultima_atualizacao_em',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});if(error)throw error;if(!data?.length){list.innerHTML='<div class="empty">Nenhum plano de treino foi liberado para você ainda.</div>';return}treino=data.find(x=>x.dia==='Geral')||data[0];const p=parseConteudo(treino.conteudo),ex=p.exercicios||p;ficha={A:ex.A||[],B:ex.B||[],C:ex.C||[],D:ex.D||[],E:ex.E||[]};objective.textContent=p.objetivoTexto||treino.objetivo||'--';level.textContent=p.nivel||treino.nivel||'--';division.textContent=p.divisao||treino.divisao||'--';version.textContent='v'+(treino.versao||1);review.textContent=treino.reavaliar_em?new Date(treino.reavaliar_em+'T12:00:00').toLocaleDateString('pt-BR'):'A definir';subtitle.textContent=`Plano de ${aluno.nome.split(' ')[0]} • atualizado ${new Date(treino.ultima_atualizacao_em||treino.created_at).toLocaleDateString('pt-BR')}`;const usados=Object.keys(ficha).filter(k=>Array.isArray(ficha[k])&&ficha[k].length);if(!usados.length){list.innerHTML='<div class="empty">A ficha existe, mas ainda não possui exercícios.</div>';return}bloco=usados[0];tabs.innerHTML=usados.map(k=>`<button class="tab ${k===bloco?'active':''}" data-block="${k}">Treino ${k}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{bloco=b.dataset.block;tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});render()}
function videoDo(item){const id=item.biblioteca_id||item.exercicio_id||item.exercise_id;if(id&&bibId[String(id)]?.video_url)return bibId[String(id)].video_url;return bibNome[norm(item.exercicio||item.nome)]?.video_url||''}
function box(label,val){return `<div class="pbox"><small>${label}</small><strong>${esc(val||'--')}</strong></div>`}
function render(){const arr=ficha[bloco]||[];if(!arr.length){list.innerHTML=`<div class="empty">Nenhum exercício no Treino ${bloco}.</div>`;return}list.innerHTML=arr.map((it,i)=>{const conj=it.tipo_item==='conjugado'&&Array.isArray(it.conjugado)&&it.conjugado.length>1;const video=videoDo(it);const extras=[it.rir?`RIR ${esc(it.rir)}`:'',it.rpe?`RPE ${esc(it.rpe)}`:'',it.cadencia?`Cadência ${esc(it.cadencia)}`:'',it.observacao?esc(it.observacao):''].filter(Boolean).join(' • ');let sub='';if(conj){sub='<div class="conj-list">'+it.conjugado.map((s,n)=>`<div class="sub"><span class="num">${n+1}</span><div><strong>${esc(s.exercicio||'Exercício')}</strong><br><small>${esc(s.reps||'--')} reps • ${esc(s.carga||'A definir')}</small></div>${videoDo(s)?`<button class="small-btn primary" data-video="${esc(videoDo(s))}" data-title="${esc(s.exercicio)}"><i class="fa-solid fa-play"></i></button>`:''}</div>`).join('')+'</div>'}return `<article class="exercise"><div class="exercise-top"><div><span class="badge ${conj?'badge-conj':''}">${conj?'CONJUGADO':'EXERCÍCIO'}</span><h3 style="margin-top:7px">${esc(it.exercicio||it.nome||'Exercício')}</h3></div></div><div class="prescription">${box('Séries',it.series)}${box('Repetições',it.reps)}${box('Carga',it.carga)}${box('Método',it.metodo)}${box('Descanso',it.descanso)}</div>${sub}${extras?`<div class="notes">${extras}</div>`:''}<div class="buttons">${video?`<button class="small-btn primary" data-video="${esc(video)}" data-title="${esc(it.exercicio||it.nome)}"><i class="fa-solid fa-play"></i> Ver vídeo</button>`:''}<button class="small-btn success" data-exec="${i}"><i class="fa-solid fa-check"></i> Registrar execução</button></div></article>`}).join('');list.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>abrirVideo(b.dataset.title,b.dataset.video));list.querySelectorAll('[data-exec]').forEach(b=>b.onclick=()=>abrirExec(arr[Number(b.dataset.exec)]))}
function abrirVideo(t,u){videoTitle.textContent='Execução: '+t;video.src=u;videoModal.classList.add('open');video.play().catch(()=>{})}function abrirExec(it){execTitle.textContent='Registrar: '+(it.exercicio||it.nome||'Exercício');execName.value=it.exercicio||it.nome||'Exercício';execLibId.value=it.biblioteca_id||'';execBlock.value=bloco;execLoad.value='';execReps.value='';execRpe.value='';execRir.value='';execObs.value='';execModal.classList.add('open')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const m=document.getElementById(b.dataset.close);m.classList.remove('open');if(m.id==='videoModal'){video.pause();video.removeAttribute('src');video.load()}});document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
execForm.addEventListener('submit',async e=>{e.preventDefault();const payload={aluno_id:aluno.id,biblioteca_exercicio_id:execLibId.value?Number(execLibId.value):null,exercicio_nome:execName.value,treino_bloco:execBlock.value,carga_realizada:execLoad.value||null,repeticoes_realizadas:execReps.value||null,rpe:execRpe.value?Number(execRpe.value):null,rir:execRir.value?Number(execRir.value):null,observacao:execObs.value||null};const btn=execForm.querySelector('button');btn.disabled=true;btn.textContent='Salvando...';const {error}=await _supabase.from('treino_execucoes').insert(payload);btn.disabled=false;btn.textContent='Salvar execução';if(error){alert('Não foi possível registrar: '+error.message);return}execModal.classList.remove('open');alert('Execução registrada com sucesso!')});
logout.onclick=async()=>{await _supabase.auth.signOut();sessionStorage.removeItem('corpofitness_aluno_id');location.replace('portal-seguro.html')};
(async()=>{try{if(!await validar())return;await biblioteca();await carregar();guard.classList.add('hidden')}catch(e){console.error(e);guard.innerHTML='<div class="guard-card"><i class="fa-solid fa-triangle-exclamation" style="color:#f87171"></i><div>Não foi possível carregar o treino.</div><a href="portal-seguro.html" style="color:#60a5fa">Voltar ao portal</a></div>'}})();
})();
</script>
</body>
</html>
