<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - CorpoFitness</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Estilos Embutidos -->
    <style>
        :root {
            --bg-dark: #121212;
            --dark-card: #1e1e1e;
            --accent: #1e88e5;
            --accent-hover: #1565c0;
            --highlight: #ffffff;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border: #2a2a2a;
            --success: #4caf50;
            --danger: #ff5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--highlight);
        }

        .logo-area i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .logo-area h1 {
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .grid-admin {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid-admin {
                grid-template-columns: 1fr;
            }
        }

        .card-admin {
            background-color: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-admin.full-width {
            grid-column: 1 / -1;
        }

        .card-admin h3 {
            font-size: 1.1rem;
            color: var(--highlight);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .card-admin h3 i {
            color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #121212;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--highlight);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            height: 90px;
        }

        .btn-acao {
            background-color: var(--accent);
            color: var(--highlight);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
            font-size: 0.95rem;
        }

        .btn-acao:hover {
            background-color: var(--accent-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        td {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-area">
            <i class="fa-solid fa-person-chalkboard"></i>
            <h1>PAINEL DO PROFESSOR (TREINOS E AVALIAÇÕES)</h1>
        </a>
        <div>
            <button onclick="sairProfessor()" class="btn-acao" style="background-color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </div>
    </header>

    <main>
        <div class="grid-admin">
            
            <!-- Atribuir Treino ao Aluno -->
            <div class="card-admin">
                <h3><i class="fa-solid fa-dumbbell"></i> Atribuir Treino ao Aluno</h3>
                <form id="formTreino">
                    <div class="form-group">
                        <label for="emailAlunoTreino">E-mail do Aluno</label>
                        <input type="email" id="emailAlunoTreino" placeholder="aluno@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="nomeTreino">Nome do Treino</label>
                        <input type="text" id="nomeTreino" placeholder="Ex: Treino A - Superior" required>
                    </div>
                    <div class="form-group">
                        <label for="detalhesTreino">Exercícios e Séries</label>
                        <textarea id="detalhesTreino" placeholder='Ex: Supino Reto 4x10, Cruxifixo 3x12...' required></textarea>
                    </div>
                    <button type="submit" class="btn-acao"><i class="fa-solid fa-floppy-disk"></i> Salvar Treino</button>
                </form>
            </div>

            <!-- Cadastrar Avaliação Física / Biometria -->
            <div class="card-admin">
                <h3><i class="fa-solid fa-scale-balanced"></i> Registrar Avaliação Física</h3>
                <form id="formAvaliacao">
                    <div class="form-group">
                        <label for="emailAlunoAvaliacao">E-mail do Aluno</label>
                        <input type="email" id="emailAlunoAvaliacao" placeholder="aluno@email.com" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pesoAluno">Peso (kg)</label>
                            <input type="number" step="0.1" id="pesoAluno" placeholder="75.5" required>
                        </div>
                        <div class="form-group">
                            <label for="alturaAluno">Altura (m)</label>
                            <input type="number" step="0.01" id="alturaAluno" placeholder="1.75" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="gorduraAluno">% Gordura</label>
                            <input type="number" step="0.1" id="gorduraAluno" placeholder="15.0">
                        </div>
                        <div class="form-group">
                            <label for="massaMagraAluno">Massa Magra (kg)</label>
                            <input type="number" step="0.1" id="massaMagraAluno" placeholder="60.0">
                        </div>
                    </div>
                    <button type="submit" class="btn-acao"><i class="fa-solid fa-plus"></i> Salvar Avaliação</button>
                </form>
            </div>

            <!-- Histórico Recente de Avaliações Lançadas -->
            <div class="card-admin full-width">
                <h3><i class="fa-solid fa-clipboard-user"></i> Avaliações Físicas Registradas Recentemente</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Peso</th>
                                <th>Altura</th>
                                <th>% Gordura</th>
                                <th>Massa Magra</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAvaliacoesAdmin">
                            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Carregando avaliações...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://rylbznbtrrsuyzxgsivg.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_3xR7VpxN0s-nIgn6t2COGA_3n9dnoBC';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.sairProfessor = function() {
            alert('Sessão encerrada.');
            window.location.href = 'index.html';
        };

        // Cadastrar Treino
        document.getElementById('formTreino').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailAlunoTreino').value;
            const nomeTreino = document.getElementById('nomeTreino').value;
            const detalhes = document.getElementById('detalhesTreino').value;

            try {
                const { error } = await _supabase.from('treinos_alunos').insert([{
                    email_aluno: email,
                    nome_treino: nomeTreino,
                    detalhes: detalhes
                }]);

                if (error) throw error;

                alert('Treino atribuído com sucesso ao aluno!');
                document.getElementById('formTreino').reset();
            } catch (err) {
                console.error("Erro ao cadastrar treino:", err);
                alert('Erro ao cadastrar treino.');
            }
        });

        // Cadastrar Avaliação Física
        document.getElementById('formAvaliacao').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailAlunoAvaliacao').value;
            const peso = parseFloat(document.getElementById('pesoAluno').value);
            const altura = parseFloat(document.getElementById('alturaAluno').value);
            const gordura = parseFloat(document.getElementById('gorduraAluno').value) || null;
            const massa_magra = parseFloat(document.getElementById('massaMagraAluno').value) || null;

            try {
                const { error } = await _supabase.from('progresso_alunos').insert([{
                    email_aluno: email,
                    peso: peso,
                    altura: altura,
                    gordura: gordura,
                    massa_magra: massa_magra
                }]);

                if (error) throw error;

                alert('Avaliação física registrada com sucesso!');
                document.getElementById('formAvaliacao').reset();
                carregarAvaliacoesAdmin();
            } catch (err) {
                console.error("Erro ao registrar avaliação:", err);
                alert('Erro ao registrar avaliação.');
            }
        });

        // Carregar Histórico de Avaliações Recentes
        async function carregarAvaliacoesAdmin() {
            const tbody = document.getElementById('tabelaAvaliacoesAdmin');
            try {
                const { data, error } = await _supabase
                    .from('progresso_alunos')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Nenhuma avaliação cadastrada recentemente.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(av => {
                    const dataFormatada = av.created_at ? new Date(av.created_at).toLocaleDateString('pt-BR') : '-';
                    tbody.innerHTML += `
                        <tr>
                            <td>${av.email_aluno}</td>
                            <td>${av.peso} kg</td>
                            <td>${av.altura} m</td>
                            <td>${av.gordura ? av.gordura + '%' : '-'}</td>
                            <td>${av.massa_magra ? av.massa_magra + ' kg' : '-'}</td>
                            <td>${dataFormatada}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Erro ao buscar avaliações:", err);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger);">Erro ao carregar avaliações.</td></tr>`;
            }
        }

        // Inicializar tabela ao carregar
        carregarAvaliacoesAdmin();
    </script>
</body>
</html>
