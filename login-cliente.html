<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Área do Aluno | Corpofitness Premium</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; --blue:#2563eb; --light:#60a5fa; --bg:#060b16; --card:#111827; --muted:#94a3b8; --border:rgba(148,163,184,.2); --danger:#f87171; --success:#34d399; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100svh; display:grid; place-items:center; padding:22px; background:radial-gradient(circle at 20% 15%,rgba(37,99,235,.22),transparent 35%),var(--bg); color:#f8fafc; font-family:"Plus Jakarta Sans",sans-serif; }
        main { width:min(100%,440px); padding:34px; border:1px solid var(--border); border-radius:22px; background:rgba(17,24,39,.94); box-shadow:0 30px 80px rgba(0,0,0,.4); }
        h1 { margin:0 0 6px; font-size:1.7rem; }
        .subtitle { margin:0 0 26px; color:var(--muted); }
        label { display:block; margin:14px 0 7px; font-size:.84rem; font-weight:700; }
        input { width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--border); border-radius:11px; color:#fff; background:#0b1220; font:inherit; }
        input:focus { outline:3px solid rgba(96,165,250,.25); border-color:var(--light); }
        button, .back { width:100%; min-height:48px; margin-top:18px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:999px; color:#fff; background:linear-gradient(135deg,var(--blue),#1d4ed8); font:inherit; font-weight:800; cursor:pointer; text-decoration:none; }
        button[disabled] { opacity:.65; cursor:wait; }
        .link { width:auto; min-height:auto; margin:18px auto 0; display:block; color:var(--light); background:none; font-size:.86rem; }
        .back { margin-top:12px; border:1px solid var(--border); background:transparent; }
        #message { min-height:24px; margin-top:16px; font-size:.86rem; }
        #message.error { color:var(--danger); }
        #message.success { color:var(--success); }
        [hidden] { display:none!important; }
        .honeypot { position:absolute!important; left:-9999px!important; width:1px!important; height:1px!important; overflow:hidden!important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body>
    <main>
        <h1>Área do Aluno</h1>
        <p class="subtitle">Entre com o e-mail cadastrado na academia.</p>
        <form id="loginForm" novalidate>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
            <div class="honeypot" aria-hidden="true"><label for="website">Site</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
            <button id="submitButton" type="submit">Entrar com segurança</button>
        </form>
        <button id="resetButton" class="link" type="button">Esqueci minha senha</button>
        <form id="passwordForm" novalidate hidden>
            <label for="newPassword">Nova senha</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
            <label for="confirmPassword">Confirme a nova senha</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
            <button id="passwordButton" type="submit">Salvar senha e continuar</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <a class="back" href="index.html">Voltar ao site</a>
    </main>
    <script>
        (() => {
            'use strict';
            const form = document.getElementById('loginForm');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const submit = document.getElementById('submitButton');
            const reset = document.getElementById('resetButton');
            const passwordForm = document.getElementById('passwordForm');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const passwordButton = document.getElementById('passwordButton');
            const message = document.getElementById('message');
            const queryFlow = new URLSearchParams(window.location.search).get('flow');
            const hashType = new URLSearchParams(window.location.hash.slice(1)).get('type');
            let passwordSetupMode = ['invite', 'reset', 'recovery'].includes(queryFlow) || ['invite', 'recovery'].includes(hashType);

            const show = (text, type = '') => {
                message.textContent = text;
                message.className = type;
            };

            const showPasswordSetup = () => {
                passwordSetupMode = true;
                form.hidden = true;
                reset.hidden = true;
                passwordForm.hidden = false;
                document.querySelector('h1').textContent = queryFlow === 'invite' || hashType === 'invite' ? 'Ative seu acesso' : 'Crie uma nova senha';
                document.querySelector('.subtitle').textContent = 'Use pelo menos 12 caracteres e não reutilize uma senha antiga.';
            };

            _supabase.auth.onAuthStateChange((event) => {
                if (event === 'PASSWORD_RECOVERY') showPasswordSetup();
            });
            if (passwordSetupMode) showPasswordSetup();

            const redirectIfAuthenticated = async () => {
                const { data: { user } } = await _supabase.auth.getUser();
                if (user && !passwordSetupMode) window.location.replace('treinos.html');
            };
            redirectIfAuthenticated().catch(() => {});

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                show('');
                if (document.getElementById('website').value || !form.reportValidity()) return;
                submit.disabled = true;
                try {
                    const { error } = await _supabase.auth.signInWithPassword({
                        email: email.value.trim().toLowerCase(),
                        password: password.value
                    });
                    if (error) throw error;
                    password.value = '';
                    window.location.replace('treinos.html');
                } catch (_) {
                    show('Não foi possível entrar. Confira o e-mail e a senha ou redefina o acesso.', 'error');
                } finally {
                    submit.disabled = false;
                }
            });

            reset.addEventListener('click', async () => {
                const value = email.value.trim().toLowerCase();
                if (!value || !email.checkValidity()) {
                    show('Informe um e-mail válido para receber o link.', 'error');
                    email.focus();
                    return;
                }
                reset.disabled = true;
                try {
                    const { error } = await _supabase.auth.resetPasswordForEmail(value, {
                        redirectTo: `${window.location.origin}/login-cliente.html?flow=reset`
                    });
                    if (error) throw error;
                    show('Se o e-mail estiver cadastrado, você receberá as instruções de acesso.', 'success');
                } catch (_) {
                    show('Não foi possível solicitar a redefinição agora. Tente novamente mais tarde.', 'error');
                } finally {
                    reset.disabled = false;
                }
            });

            passwordForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                show('');
                if (!passwordForm.reportValidity()) return;
                if (newPassword.value !== confirmPassword.value) {
                    show('As senhas não coincidem.', 'error');
                    return;
                }
                passwordButton.disabled = true;
                try {
                    const { data: { user } } = await _supabase.auth.getUser();
                    if (!user) throw new Error('missing session');
                    const { error } = await _supabase.auth.updateUser({ password: newPassword.value });
                    if (error) throw error;
                    newPassword.value = '';
                    confirmPassword.value = '';
                    window.history.replaceState({}, document.title, '/login-cliente.html');
                    show('Senha definida com sucesso. Abrindo seu portal…', 'success');
                    setTimeout(() => window.location.replace('treinos.html'), 700);
                } catch (_) {
                    show('O link expirou ou não é válido. Solicite uma nova redefinição.', 'error');
                    passwordButton.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
