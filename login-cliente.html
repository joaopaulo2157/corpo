<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso do Cliente | Corpofitness Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        const NEXT_PUBLIC_SUPABASE_URL = 'https://rylbznbtrrsuyzxgsivg.supabase.co'; 
        const NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_3xR7VpxN0s-nIgn6t2COGA_3n9dnoBC';
        const _supabase = supabase.createClient(NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
    </script>

    <style>
        :root {
            --primary: #0066ff;
            --primary-light: #4da3ff;
            --dark: #050b15;
            --dark-2: #081423;
            --dark-card: #0c1b2d;
            --text-color: #ffffff;
            --gray: #b8c4d6;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ff3333;
            --success: #25d366;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--dark); color: var(--text-color); display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }

        .auth-container {
            background: var(--dark-card);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h2 { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .auth-header p { font-size: 0.85rem; color: var(--gray); margin-top: 5px; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-weight: 600; font-size: 0.83rem; color: var(--gray); margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px;
            font-size: 0.9rem; color: var(--text-color); background: var(--dark-2); outline: none; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2); }

        .btn {
            background: linear-gradient(135deg, #0066ff, #4da3ff); color: #fff; border: none;
            padding: 12px; border-radius: 50px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            width: 100%; transition: transform 0.2s; margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--gray); margin-top: 8px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .auth-switch { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--gray); }
        .auth-switch a { color: var(--primary-light); text-decoration: none; font-weight: 600; cursor: pointer; }
        .auth-switch a:hover { text-decoration: underline; }

        .alert-msg { font-size: 0.8rem; margin-bottom: 15px; padding: 10px; border-radius: 8px; display: none; text-align: center; }
        .alert-error { background: rgba(255, 51, 51, 0.15); color: var(--danger); border: 1px solid rgba(255, 51, 51, 0.3); }
        .alert-success { background: rgba(37, 211, 102, 0.15); color: var(--success); border: 1px solid rgba(37, 211, 102, 0.3); }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- TELA 1: LOGIN -->
           <div class="logo">
                <img src="img/logo.png" alt="Corpofitness Premium" class="logo-img" style="width: 150px; display: block; margin: 0 auto 20px;">
                <p></p>
           </div>
        <div id="boxLogin">
            <div class="auth-header">
                <h2>Área do Aluno</h2>
                <p>Entre com seu e-mail ou telefone e senha</p>
            </div>
            <div id="loginAlert" class="alert-msg alert-error"></div>
            <form id="formLoginClient">
                <div class="form-group">
                    <label class="form-label">E-mail ou Telefone</label>
                    <input type="text" id="loginIden" class="form-control" required placeholder="seu@email.com ou (11) 99999-9999">
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" id="loginSenha" class="form-control" required placeholder="••••••••">
                </div>
                <div style="text-align: right; margin-bottom: 15px;">
                    <a onclick="alternarTela('recuperar')" style="font-size: 0.8rem; color: var(--primary-light); cursor: pointer;">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn">Entrar na Conta</button>
            </form>
            <!-- Adicione este bloco dentro do #boxLogin, logo abaixo do form -->
<div style="margin: 20px 0; text-align: center; position: relative;">
    <span style="background: var(--dark-card); padding: 0 10px; color: var(--gray); font-size: 0.75rem; position: relative; z-index: 2;">OU CONECTE-SE COM</span>
    <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--border); z-index: 1;"></div>
</div>

<button type="button" onclick="loginComGoogle()" class="btn" style="background: #ffffff; color: #000000; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <i class="fab fa-google" style="color: #ea4335;"></i> Entrar com o Google
</button>
            <div class="auth-switch">
                Ainda não tem cadastro? <a onclick="alternarTela('cadastro')">Criar conta agora</a>
            </div>
        </div>

        <!-- TELA 2: CADASTRO -->
        <div id="boxCadastro" style="display: none;">
            <div class="auth-header">
                <h2>Criar Conta</h2>
                <p>Preencha seus dados para acessar o portal</p>
            </div>
            <div id="cadAlert" class="alert-msg alert-error"></div>
            <form id="formCadClient">
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" id="cadNome" class="form-control" required placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="cadEmail" class="form-control" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Telefone / WhatsApp</label>
                    <input type="text" id="cadTel" class="form-control" required placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" id="cadSenha" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn">Cadastrar Conta</button>
                <button type="button" class="btn btn-secondary" onclick="alternarTela('login')">Voltar ao Login</button>
            </form>
        </div>

        <!-- TELA 3: RECUPERAÇÃO DE SENHA -->
        <div id="boxRecuperar" style="display: none;">
            <div class="auth-header">
                <h2>Recuperar Senha</h2>
                <p>Informe seu e-mail cadastrado para redefinir o acesso</p>
            </div>
            <div id="recAlert" class="alert-msg alert-error"></div>
            <form id="formRecClient">
                <div class="form-group">
                    <label class="form-label">E-mail Cadastrado</label>
                    <input type="email" id="recEmail" class="form-control" required placeholder="seu@email.com">
                </div>
                <button type="submit" class="btn">Enviar Instruções</button>
                <button type="button" class="btn btn-secondary" onclick="alternarTela('login')">Voltar ao Login</button>
            </form>
        </div>

    </div>

    <script>
        function alternarTela(tipo) {
            document.getElementById('boxLogin').style.display = tipo === 'login' ? 'block' : 'none';
            document.getElementById('boxCadastro').style.display = tipo === 'cadastro' ? 'block' : 'none';
            document.getElementById('boxRecuperar').style.display = tipo === 'recuperar' ? 'block' : 'none';
        }

        // --- CADASTRO DE CLIENTE ---
        document.getElementById('formCadClient').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cadNome').value.trim();
            const email = document.getElementById('cadEmail').value.trim();
            const telefone = document.getElementById('cadTel').value.trim();
            const senha = document.getElementById('cadSenha').value.trim();
            const alertBox = document.getElementById('cadAlert');

            try {
                const { error } = await _supabase.from('clientes_portal').insert([{ nome, email, telefone, senha }]);
                if (error) throw error;
                
                alertBox.className = "alert-msg alert-success";
                alertBox.textContent = "Conta criada com sucesso! Faça login.";
                alertBox.style.display = "block";
                setTimeout(() => alternarTela('login'), 2000);
            } catch (err) {
                alertBox.className = "alert-msg alert-error";
                alertBox.textContent = "Erro ao cadastrar: " + (err.message.includes('duplicate') ? 'E-mail já cadastrado.' : err.message);
                alertBox.style.display = "block";
            }
        });

        // --- LOGIN DE CLIENTE (E-mail ou Telefone + Senha) ---
        document.getElementById('formLoginClient').addEventListener('submit', async (e) => {
            e.preventDefault();
            const iden = document.getElementById('loginIden').value.trim();
            const senha = document.getElementById('loginSenha').value.trim();
            const alertBox = document.getElementById('loginAlert');

            try {
                // Busca por e-mail ou telefone
                const { data: clientes, error } = await _supabase.from('clientes_portal').select('*').or(`email.eq.${iden},telefone.eq.${iden}`);
                if (error || !clientes || clientes.length === 0) {
                    throw new Error("Usuário não encontrado.");
                }

                const cliente = clientes.find(c => c.senha === senha);
                if (!cliente) {
                    throw new Error("Senha incorreta.");
                }

                // Salva a sessão do cliente
                sessionStorage.setItem('corpofitness_cliente_logado', JSON.stringify(cliente));
                window.location.href = "index.html"; // Redireciona para o site principal logado
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.style.display = "block";
            }
        });

        // --- RECUPERAÇÃO DE SENHA ---
        document.getElementById('formRecClient').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('recEmail').value.trim();
            const alertBox = document.getElementById('recAlert');

            const { data: cliente } = await _supabase.from('clientes_portal').select('*').eq('email', email).single();
            
            alertBox.className = "alert-msg alert-success";
            alertBox.textContent = cliente ? "Instruções enviadas para o seu e-mail!" : "E-mail não encontrado na base.";
            alertBox.style.display = "block";
        });

// --- LOGIN SOCIAL COM GOOGLE ---
window.loginComGoogle = async function() {
    try {
        const { error } = await _supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin + '/login-cliente.html'
            }
        });
        if (error) throw error;
    } catch (err) {
        alert('Erro ao conectar com Google: ' + err.message);
    }
};

// Verificar se o usuário retornou autenticado via Google ao carregar a página
window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session && session.user) {
        const googleUser = {
            nome: session.user.user_metadata.full_name || session.user.email.split('@')[0],
            email: session.user.email,
            telefone: session.user.phone || ''
        };
        
        // Salva na sessão do portal e redireciona
        sessionStorage.setItem('corpofitness_cliente_logado', JSON.stringify(googleUser));
        window.location.href = "index.html";
    }
});

    </script>
</body>
</html>
