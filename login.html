<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo | Corpofitness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0f1115;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }
        .login-card {
            background: #1a1d24;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .login-card h2 {
            margin-bottom: 24px;
            text-align: center;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #252830;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #3182ce;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #2b6cb0;
        }
        .error-msg {
            color: #fc8181;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .forgot-password {
            margin-top: 15px;
            text-align: center;
        }
        .forgot-password a {
            color: #a0aec0;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .forgot-password a:hover {
            color: #3182ce;
            text-decoration: underline;
        }
    </style>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const NEXT_PUBLIC_SUPABASE_URL = 'https://rylbznbtrrsuyzxgsivg.supabase.co'; 
        const NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_3xR7VpxN0s-nIgn6t2COGA_3n9dnoBC';
        const _supabase = supabase.createClient(NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY);
    </script>
</head>
<body>

    <div class="login-card">
        <h2>Área Administrativa</h2>
        <form id="formLogin">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btnEntrar">Entrar no Sistema</button>
            <p id="erroLogin" class="error-msg">E-mail ou senha incorretos.</p>
            
            <div class="forgot-password">
                <a href="#" id="linkEsqueceuSenha">Esqueceu sua senha?</a>
            </div>
        </form>
    </div>

    <script>
        // Lógica de Autenticação / Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('senha').value;
            const btn = document.getElementById('btnEntrar');
            const erroMsg = document.getElementById('erroLogin');

            btn.textContent = 'Autenticando...';
            btn.disabled = true;
            erroMsg.style.display = 'none';

            const { data, error } = await _supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                erroMsg.style.display = 'block';
                btn.textContent = 'Entrar no Sistema';
                btn.disabled = false;
            } else {
                window.location.href = 'admin.html';
            }
        });

        // Lógica de Recuperação de Senha
        document.getElementById('linkEsqueceuSenha').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('Digite o e-mail cadastrado para recuperação de senha:');
            
            if (!email) return;

            const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/login.html',
            });

            if (error) {
                alert('Erro ao enviar e-mail de recuperação: ' + error.message);
            } else {
                alert('E-mail de recuperação enviado com sucesso! Verifique sua caixa de entrada.');
            }
        });
    </script>
</body>
</html>
